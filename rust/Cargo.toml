[package]
name = "shinkai-native"
version = "0.1.0"
edition = "2024"

[lib]
name = "shinkai"
crate-type = ["cdylib"]

[dependencies]
jni = "0.22.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "gzip", "brotli"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "fs", "io-util"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
thiserror = "2"
md5 = "0.8.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
